<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacation Destination List</title>

    <!-- <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/css/normalize.min.css" rel="stylesheet"> -->

    <link rel="stylesheet"  href="style.css">
</head>
<body>
    
    <header>
        <h1>Vacation Destination Wish List</h1>
        <p>Found Exciting places to visition on your next Vacation? Use the form below
            to add then to your Wish List
        </p>
    </header>

    <main>
        <form id="destination_details_form">
            <label  for="name">Destination  Name</label>
            <input type="text"  id="name" placeholder="provide a name for the destination" required>
            
            <Label  for="location">Destination  Location</Label>
            <input type="text"  id="location"  placeholder="Where is the destination located" required>

            <label for="photo">photo</label>
            <input type="url" id="photo" placeholder="provide a url for the photo">

            <label  for="description">Destination  Description</label>
            <textarea id="description" placeholder="Describe the destination"></textarea>

            <button type="submit">Add To List</button>
        </form>

        <article>
            <h2 id="title">Enter Destination Details</h2>
            <div id="destination_container">

                <!-- Dynamically populated by javascript -->
                
            </div>
        </article>
    </main>


    <script src="script.js"></script>
</body>
</html>
